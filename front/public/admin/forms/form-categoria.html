<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corvis Admin — Categoria</title>
  <link rel="stylesheet" href="/admin/css/admin-theme.css">
</head>
<body class="admin-body">
  <div id="menu-container"></div>
  <main class="admin-form-shell">
    <a class="admin-breadcrumb" href="/admin/lista-categorias.html">← Voltar para categorias</a>
    <form onsubmit="enviarFormulario(event)" class="admin-form-card">
      <header class="admin-form-card__head">
        <p>Organização da biblioteca</p>
        <h1 id="form-title">Nova categoria</h1>
        <span>Defina um agrupamento claro para as trilhas de aprendizagem.</span>
      </header>
      <div class="admin-form-card__body">
        <div class="admin-field">
          <label for="nome">Nome da categoria</label>
          <small>Use um nome curto e fácil de reconhecer.</small>
          <input type="text" id="nome" name="nome" required placeholder="Ex.: Programação">
        </div>
        <div class="admin-field">
          <label for="descricao">Descrição</label>
          <small>Explique quais conteúdos pertencem a esta categoria.</small>
          <textarea id="descricao" name="descricao" required placeholder="Descreva a categoria."></textarea>
        </div>
        <div class="admin-form-actions">
          <a class="admin-button admin-button--secondary" href="/admin/lista-categorias.html">Cancelar</a>
          <button type="submit" class="admin-button admin-button--primary">Salvar categoria</button>
        </div>
        <p id="cadastrada" class="admin-status" aria-live="polite"></p>
      </div>
    </form>
  </main>
  <script src="/admin/menu.js"></script>
  <script src="/admin/js/form-categoria.js"></script>
</body>
</html>
