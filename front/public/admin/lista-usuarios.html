<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corvis Admin — Usuários</title>
  <link rel="stylesheet" href="/admin/css/admin-theme.css">
</head>
<body class="admin-body">
  <div id="drawer-overlay" onclick="closeDrawer()" class="admin-drawer-overlay hidden"></div>
  <aside id="drawer" class="admin-drawer translate-x-full" aria-labelledby="drawer-title">
    <header class="admin-drawer__head">
      <h2 id="drawer-title">Detalhes do usuário</h2>
      <button onclick="closeDrawer()" class="admin-drawer__close" aria-label="Fechar">&times;</button>
    </header>
    <div id="drawer-content" class="admin-drawer__content"></div>
  </aside>
  <div id="menu-container"></div>
  <main class="admin-main">
    <header class="admin-page-head">
      <div>
        <p class="admin-page-head__eyebrow">Comunidade de aprendizagem</p>
        <h1>Usuários</h1>
        <p class="admin-page-head__description">Consulte os estudantes cadastrados e suas informações de perfil.</p>
      </div>
      <span class="admin-count" id="usuarios-count">Carregando...</span>
    </header>
    <section id="usuarios-list" class="admin-grid" aria-live="polite"></section>
  </main>
  <script src="/admin/menu.js"></script>
  <script src="/admin/js/usuarios.js"></script>
</body>
</html>
