<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corvis Admin — Administradores</title>
  <link rel="stylesheet" href="/admin/css/admin-theme.css">
</head>
<body class="admin-body">
  <div id="drawer-overlay" onclick="closeDrawer()" class="admin-drawer-overlay hidden"></div>
  <aside id="drawer" class="admin-drawer translate-x-full" aria-labelledby="drawer-title">
    <header class="admin-drawer__head">
      <h2 id="drawer-title">Detalhes do administrador</h2>
      <button onclick="closeDrawer()" class="admin-drawer__close" aria-label="Fechar">&times;</button>
    </header>
    <div id="drawer-content" class="admin-drawer__content"></div>
  </aside>
  <div id="menu-container"></div>
  <main class="admin-main">
    <header class="admin-page-head">
      <div>
        <p class="admin-page-head__eyebrow">Controle de acesso</p>
        <h1>Administradores</h1>
        <p class="admin-page-head__description">Consulte quem possui permissão para gerenciar o conteúdo e os usuários.</p>
      </div>
      <span class="admin-count" id="administradores-count">Carregando...</span>
    </header>
    <section id="administradores-list" class="admin-grid" aria-live="polite"></section>
  </main>
  <script src="/admin/menu.js"></script>
  <script src="/admin/js/administradores.js"></script>
</body>
</html>
